server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3000/;   # confirm PORT + API base path against your actual routes
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;        # SPA fallback for react-router
    }
}
